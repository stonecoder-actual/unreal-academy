name: unreal-academy
services:
  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_PATH: /data/academy.sqlite3
      COURSES_ROOT: /courses
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${COURSES_DIR:-./courses}:/courses:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  backend-tests:
    profiles: [test]
    build:
      context: ./backend
      target: test
